;
; Config set 'robust-hg': a grid's Robust services with Hypergrid, from OpenSim's own Robust.HG.ini.example, with
; Groups V2 (also over Hypergrid) and offline IM switched on, and FSAssets (assets as files, not in the database). 'osctl grid add' uses it; osctl sets the host, ports,
; database and grid name itself. See PLAN.md "Robust and local grids".

[ConfigSet]
    Description = A grid's Robust services with Hypergrid, groups, offline IM and FSAssets
    Mode = robust
    Load = Robust.HG.ini

[Files]
    Robust.HG.ini = bin:Robust.HG.ini.example

[Set Robust.HG.ini]
    ServiceList|OfflineIMServiceConnector = "${Const|PrivatePort}/OpenSim.Addons.OfflineIM.dll:OfflineIMServiceRobustConnector"
    ServiceList|GroupsServiceConnector = "${Const|PrivatePort}/OpenSim.Addons.Groups.dll:GroupsServiceRobustConnector"
    ServiceList|HGGroupsServiceConnector = "${Const|PublicPort}/OpenSim.Addons.Groups.dll:HGGroupsServiceRobustConnector"
    Hypergrid|HomeURI = "${Const|BaseURL}:${Const|PublicPort}"
    Hypergrid|GatekeeperURI = "${Const|BaseURL}:${Const|PublicPort}"
    GridInfoService|gatekeeper = "${Const|BaseURL}:${Const|PublicPort}/"
    GridInfoService|uas = "${Const|BaseURL}:${Const|PublicPort}/"
    ; FSAssets: osctl sets its BaseDirectory and SpoolDirectory ([Grid] AssetsDir in the grid's instance.ini).
    AssetService|LocalServiceModule = "OpenSim.Services.FSAssetService.dll:FSAssetConnector"
    AssetService|ShowConsoleStats = false
    HGAssetService|LocalServiceModule = "OpenSim.Services.HypergridService.dll:HGFSAssetService"
    GridService|AssetService = "OpenSim.Services.FSAssetService.dll:FSAssetConnector"

;
; Config set 'standalone-hg': OpenSim's standalone setup with Hypergrid. See PLAN.md "Config sets and grids".

[ConfigSet]
    Description = OpenSim's standalone setup with Hypergrid
    Mode = standalone
    Load = OpenSimDefaults.ini, OpenSim.ini

[Files]
    OpenSim.ini = bin:OpenSim.ini.example
    config-include/StandaloneCommon.ini = bin:config-include/StandaloneCommon.ini.example
    config-include/FlotsamCache.ini = bin:config-include/FlotsamCache.ini.example

; Edits to a file before its includes are followed: Section|Key = value.
[Set OpenSim.ini]
    Architecture|Include-Architecture = config-include/StandaloneHypergrid.ini

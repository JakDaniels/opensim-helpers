;
; Config set 'osgrid': regions on OSGrid (https://www.osgrid.org), with the ini files OSGrid publishes.
; 'osctl configset fetch osgrid' downloads them again. See PLAN.md "Config sets and grids".

[ConfigSet]
    Description = Regions on OSGrid, with OSGrid's published ini files
    Mode = grid
    Grid = osgrid
    Load = OpenSimDefaults.ini, OpenSim.ini

[Files]
    OpenSim.ini = https://download.osgrid.org/OpenSim.ini.txt
    config-include/GridCommon.ini = https://download.osgrid.org/GridCommon.ini.txt
    config-include/FlotsamCache.ini = https://download.osgrid.org/FlotsamCache.ini.txt

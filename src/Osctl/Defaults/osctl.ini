;
; osctl's settings. The values below are the defaults; change what you need.
; Passwords do not go here: they go in secrets.ini next to this file.

[Ports]
    ; Each region listens on its own port, allocated from this range; an instance's main HTTP port is its
    ; lowest region port.
    RegionPortMin = 9000
    RegionPortMax = 9099
    ; The HTTPS port, if an instance turns HTTPS on, is the HTTP port plus this.
    SslPortOffset = 500

[Timeouts]
    ; How long an instance may take to be ready for logins, and to shut down before it is killed.
    StartSeconds = 180
    StopSeconds = 90

[Restart]
    ; A crashed instance is restarted after DelaySeconds. More than MaxRestarts starts within IntervalSeconds
    ; and it is left stopped as "broken" until you start it again.
    MaxRestarts = 3
    IntervalSeconds = 300
    DelaySeconds = 10

[Tmux]
    ; The consoles' tmux prefix key (MIOS used Ctrl-a) and scrollback.
    Prefix = C-a
    HistoryLimit = 10000

[Database]
    ; The MariaDB/MySQL server. AdminUser creates and drops the instances' databases; User is what OpenSim
    ; connects as. Database names start with DatabasePrefix.
    Host = localhost
    Port = 3306
    AdminUser = osctl_admin
    User = opensim
    DatabasePrefix = opensim_

[Defaults]
    ; What 'osctl instance add' uses when --configset or --build is not given.
    ConfigSet = standalone
    ; Build = master

[Account]
    ; The system user that runs the instances, and the group whose members may manage them.
    User = opensim
    Group = opensim

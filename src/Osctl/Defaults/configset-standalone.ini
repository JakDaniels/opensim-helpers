;
; Config set 'standalone': OpenSim's own standalone setup (no Hypergrid). All services run in the instance.
; See PLAN.md "Config sets and grids".

[ConfigSet]
    Description = OpenSim's standalone setup, no Hypergrid
    ; standalone: the instance runs its own services (and creates the estate owner's account);
    ; grid: the services are a grid's.
    Mode = standalone
    ; Grid (grid mode only): instances in the same grid share an estate database and an asset cache, and their
    ; region locations and names must not clash. Each standalone instance is a grid of its own.
    ; The files loaded first, in order; their Include-* files follow, as OpenSim does it.
    Load = OpenSimDefaults.ini, OpenSim.ini

[Files]
    ; Where a file comes from, when not from the build's bin/: bin:<path> (another file in bin/), an https URL
    ; (downloaded by 'osctl configset fetch'), or a file path (relative to /etc/osctl/configsets/).
    OpenSim.ini = bin:OpenSim.ini.example
    config-include/StandaloneCommon.ini = bin:config-include/StandaloneCommon.ini.example
    config-include/FlotsamCache.ini = bin:config-include/FlotsamCache.ini.example

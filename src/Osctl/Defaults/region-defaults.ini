;
; Settings every region starts with (MIOS's Regions.ini defaults). A region's own settings, and the files in an
; instance's regions/ directory, override these.

[Region Defaults]
    InternalAddress = 0.0.0.0
    AllowAlternatePorts = False
    ExternalHostName = SYSTEMIP
    NonphysicalPrimMax = 1024
    PhysicalPrimMax = 64
    ClampPrimSize = False
    MaxPrims = 15000
    MaxAgents = 100
    RegionType = Mainland
